[project]
name = "balatro-agent-mcp"
version = "0.1.0"
description = "FastMCP wrapper for the local Balatro Agent mod"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.0,<4.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
balatro-agent-mcp-server = "balatro_agent_mcp.server:main"
balatro-agent-network-mcp-server = "balatro_agent_mcp.network_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balatro_agent_mcp"]

[tool.uv]
package = true
